name: App

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols/android
      - name: Build app bundle
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols/android
      - name: Size report
        run: |
          {
            echo "### Android release size"
            echo
            echo "| File | Size | Compressed (≈ download) |"
            echo "| -- | --: | --: |"
            for f in build/app/outputs/flutter-apk/app-*-release.apk build/app/outputs/bundle/release/app-release.aab; do
              size=$(stat -c%s "$f")
              gz=$(gzip -9 -c "$f" | wc -c)
              printf '| %s | %.1f MB | %.1f MB |\n' "$(basename "$f")" "$(echo "$size/1048576" | bc -l)" "$(echo "$gz/1048576" | bc -l)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          retention-days: 14
          path: |
            app/build/app/outputs/flutter-apk/app-*-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/symbols/android

  ios:
    name: iOS release
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Unsigned: CI has no Apple certificates yet. Size is close to a signed build.
      - name: Build iOS app
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols/ios
      - name: Size report
        run: |
          app=build/ios/iphoneos/Runner.app
          (cd build/ios/iphoneos && zip -qr -9 ../Runner.app.zip Runner.app)
          size=$(find "$app" -type f -exec stat -f%z {} + | awk '{s+=$1} END {print s}')
          zipped=$(stat -f%z build/ios/Runner.app.zip)
          {
            echo "### iOS release size"
            echo
            echo "| File | Size | Compressed (≈ download) |"
            echo "| -- | --: | --: |"
            printf '| Runner.app | %.1f MB | %.1f MB |\n' "$(echo "$size/1048576" | bc -l)" "$(echo "$zipped/1048576" | bc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-release
          retention-days: 14
          path: |
            app/build/ios/Runner.app.zip
            app/build/symbols/ios
