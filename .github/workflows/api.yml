name: API

on:
  pull_request:
    paths:
      - "api/**"
      - "data/municipalities/14100/bundle.json"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "data/municipalities/14100/bundle.json"
      - ".github/workflows/api.yml"
  workflow_dispatch:

# Cancel superseded PR runs, but never a run on main half way through a deploy.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WORKER_BUILD_VERSION: "0.9.0"

defaults:
  run:
    working-directory: api

jobs:
  check:
    name: Lint, test and run locally
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.4 check --config ../data/ruff.toml tests
      - run: uvx ruff@0.17.4 format --config ../data/ruff.toml --check tests
      - run: cargo fmt --all --check
      - run: cargo clippy -p binpal-api-core --all-targets -- -D warnings
      - run: cargo clippy -p binpal-api --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p binpal-api-core
      - run: cargo install worker-build@${{ env.WORKER_BUILD_VERSION }} --locked
      - run: npm ci
      # The Worker under wrangler dev with local D1 and KV, against a mock
      # Anthropic API and CDN: no secrets, no spend.
      - run: python3 tests/e2e.py

  # Deploys to Cloudflare after the checks pass on main, only when the push
  # changed api/ (a bundle-only or workflow-only change runs the checks but
  # keeps the deployed Worker). A manual run on main always deploys.
  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: api-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for API changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- .; then
            echo "no changes under api/, skipping deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check configuration
        if: steps.changes.outputs.deploy == 'true'
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see api/README.md)"; missing=1; fi
          done
          exit $missing
      - if: steps.changes.outputs.deploy == 'true'
        run: rustup target add wasm32-unknown-unknown
      - if: steps.changes.outputs.deploy == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - if: steps.changes.outputs.deploy == 'true'
        run: cargo install worker-build@${{ env.WORKER_BUILD_VERSION }} --locked
      - if: steps.changes.outputs.deploy == 'true'
        run: npm ci
      # Migrations first, so the new code never runs against an old schema.
      # Already applied migrations are skipped.
      - if: steps.changes.outputs.deploy == 'true'
        run: npx wrangler d1 migrations apply binpal-api --remote
      - if: steps.changes.outputs.deploy == 'true'
        run: npx wrangler deploy
      - name: Smoke test
        if: steps.changes.outputs.deploy == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if body=$(curl -fsS https://api.blidir.fun/v1/status); then
              echo "$body"
              echo "### API deployed" >> "$GITHUB_STEP_SUMMARY"
              echo "\`/v1/status\`: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://api.blidir.fun/v1/status did not answer after deploy"
          exit 1
