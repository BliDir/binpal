name: binpal
description: "Garbage sorting and collection days for Japan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  geolocator: ^14.1.2
  flutter_local_notifications: ^23.0.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
