[package]
name = "binpal-api"
version = "0.1.0"
edition = "2024"
description = "The BinPal thin API on Cloudflare Workers: AI fallback for photo check, and reports."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
binpal-api-core = { path = "../core" }
futures-util = { version = "0.3.31", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
worker = { version = "0.9", features = ["d1"] }
