name = "binpal-api"
main = "worker/build/index.js"
compatibility_date = "2026-11-01"

# Served on its own subdomain beside the data CDN, so the app doesn't depend
# on the workers.dev name. Cloudflare creates the DNS record and certificate
# on deploy; the blidir.fun zone must be in this account.
routes = [
  { pattern = "api.blidir.fun", custom_domain = true }
]

[build]
command = "cd worker && worker-build --release"

[vars]
CDN_BASE_URL = "https://data.blidir.fun"
AI_CALLS_PER_INSTALL_PER_DAY = "20"
REPORTS_PER_INSTALL_PER_DAY = "10"

# Workers AI answers first, free up to Cloudflare's 10,000 Neurons a day
# (about 150 photos on this model). The Worker stops at this many Neurons
# per UTC day, under the free 10,000, so a Workers Paid account is never
# billed for overage.
WORKERS_AI_MODEL = "@cf/qwen/qwen3.8-27b"
WORKERS_AI_DAILY_NEURONS = "9000"

# Anthropic is the fallback when Workers AI fails, can't tell, or is used up
# for the day. It is off unless the ANTHROPIC_API_KEY secret is set (with
# `wrangler secret put`, never here). DAILY_BUDGET_USD caps its spend per
# Japan day; once both are used up, /v1/status says "paused" and the app
# stays on-device.
ANTHROPIC_MODEL = "claude-haiku-5-5"
ANTHROPIC_BASE_URL = "https://api.anthropic.com"
DAILY_BUDGET_USD = "1"

# "This looks wrong" reports are filed every five minutes as issues in this
# repository, the review queue the rule monitor also uses. Needs the
# GITHUB_TOKEN secret (a fine-grained token with Issues: read and write on
# this repository only); without it reports are stored and wait.
GITHUB_REPO = "BliDir/binpal"

[ai]
binding = "AI"

# Usage counters, daily spend, tuning log and reports.
[[d1_databases]]
binding = "DB"
database_name = "binpal-api"
database_id = "3877303f-578c-4453-bebb-b20477e58e31"
migrations_dir = "migrations"

# Cached answers, area lookups and category guides.
[[kv_namespaces]]
binding = "CACHE"
id = "7d150e9ff3014587b27adf2735874fd1"

# Per-install burst limit: 10 requests a minute, before any other work.
[[ratelimits]]
name = "BURST"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Daily cleanup at 03:00 in Japan: counters after 2 days, log after 90.
# Every five minutes: file new reports in the review queue.
[triggers]
crons = ["0 18 * * *", "*/5 * * * *"]

[observability]
enabled = true
