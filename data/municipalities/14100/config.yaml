      en: This data is adapted from "ごみと資源物の出し方一覧表" (list of how to put out waste and resources) by the City of Yokohama, Kanagawa, licensed under Creative Commons Attribution 4.0 International. English text and kana readings were added by BinPal and are not the city's.
    license: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/deed.ja
  - text:
      ja: 収集曜日と年末年始の収集日程は、横浜市ウェブサイトの各区の収集曜日のページをもとに作成。
      en: Collection days and the New Year schedule are taken from the collection-day pages on the City of Yokohama website.
    license: LicenseRef-Yokohama-City-Website
