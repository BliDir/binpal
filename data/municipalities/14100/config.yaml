# Yokohama City (14100). Read by data/scripts/build_yokohama.py.

bundle_version: 1

municipality:
  id: "14100"
  prefecture_code: "14"
  names: { ja: 横浜市, kana: よこはまし, en: Yokohama City }
  website_url: https://www.city.yokohama.lg.jp/

